# Initial mixtures over the 6 non-holdout types left after refinement (Megakaryocytes are
# all removed by QC): uniform, natural, CD8/NK-heavy, monocyte-heavy, B-heavy.
# Natural shares: runs/refine/refined.h5ad without CD4 T cells (12,996 cells).
# budget 2400 keeps every mixture within the smallest per-condition pool
# (Dendritic cells: 224 ctrl), so the actual mixture equals the requested one.
# Paths shared by workers use YAML anchors and can be changed at their definitions.
project_name: single-cell-mixing
experiment_name: kang2018
work_dir: &run_dir /root/autodl-tmp/task4-datajuicer/runs/mixing/kang2018
hpo_config: null
max_iter_num: 2
iter_updater:
  anonymous.suggest.mixtures: anonymous.sample.extra_configs.request.mixtures
  anonymous.evaluate.history: anonymous.evaluate.extra_configs.request.history
execution_job_configs:
- hook: SingleCellSampleHook
  meta_name: sample
  output:
  - candidates
  extra_configs:
    python: &worker_python /root/autodl-tmp/task4-datajuicer/envs/single-cell/bin/python
    request:
      data_path: &data_path /root/autodl-tmp/task4-datajuicer/runs/refine/refined.h5ad
      work_dir: *run_dir
      fields: &id001
        cell_type: cell_type
        condition: label
        donor: replicate
      conditions: &id002
        control: ctrl
        perturbed: stim
      holdout_cell_type: CD4 T cells
      budget: 2400
      mixtures:
      - B cells: 0.16666666666666666
        CD14+ Monocytes: 0.16666666666666666
        CD8 T cells: 0.16666666666666666
        Dendritic cells: 0.16666666666666666
        FCGR3A+ Monocytes: 0.16666666666666666
        NK cells: 0.16666666666666666
      - &natural
        B cells: 0.20144659895352415
        CD14+ Monocytes: 0.425284702985534
        CD8 T cells: 0.12411511234225915
        Dendritic cells: 0.03593413357956294
        FCGR3A+ Monocytes: 0.08140966451215759
        NK cells: 0.13180978762696213
      - B cells: 0.1
        CD14+ Monocytes: 0.1
        CD8 T cells: 0.35
        Dendritic cells: 0.05
        FCGR3A+ Monocytes: 0.05
        NK cells: 0.35
      - B cells: 0.1
        CD14+ Monocytes: 0.35
        CD8 T cells: 0.1
        Dendritic cells: 0.05
        FCGR3A+ Monocytes: 0.35
        NK cells: 0.05
      - B cells: 0.5
        CD14+ Monocytes: 0.1
        CD8 T cells: 0.1
        Dendritic cells: 0.1
        FCGR3A+ Monocytes: 0.1
        NK cells: 0.1
      seeds:
      - 11
      - 23
      - 37
- hook: SingleCellTrainHook
  meta_name: train
  output:
  - candidates
  extra_configs:
    python: *worker_python
    request:
      data_path: *data_path
      work_dir: *run_dir
      fields: *id001
      conditions: *id002
      holdout_cell_type: CD4 T cells
      train:
        max_epochs: 100
        batch_size: 32
        early_stopping: true
        early_stopping_patience: 25
      max_parallel: 5
  input:
    extra_configs.request.candidates: anonymous.sample.candidates
evaluation_job_configs:
- hook: SingleCellEvaluateHook
  meta_name: evaluate
  output:
  - candidates
  - history
  extra_configs:
    python: *worker_python
    request:
      data_path: *data_path
      work_dir: *run_dir
      fields: *id001
      conditions: *id002
      holdout_cell_type: CD4 T cells
      n_degs: 100
      metric: r2_top_degs
      history: []
  input:
    extra_configs.request.candidates: anonymous.train.candidates
- hook: SingleCellSuggestHook
  meta_name: suggest
  output:
  - mixtures
  extra_configs:
    python: *worker_python
    request:
      data_path: *data_path
      work_dir: *run_dir
      fields: *id001
      conditions: *id002
      holdout_cell_type: CD4 T cells
      n_suggestions: 5
      seed: 0
      num_samples: 100000
      prior: *natural
  input:
    extra_configs.request.history: anonymous.evaluate.history
